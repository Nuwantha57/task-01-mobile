name: staff_auth_mobile
description: Staff Authentication Mobile App with AWS Cognito
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # AWS Amplify for Cognito Authentication
  amplify_flutter: ^2.0.0
  amplify_auth_cognito: ^2.0.0
  shared_preferences: ^2.2.0
  qr_flutter: ^4.1.0

  # HTTP Client
  http: ^1.1.0

  # Secure Storage for Tokens
  flutter_secure_storage: ^9.0.0

  # State Management
  provider: ^6.1.1

  # UI Components
  cupertino_icons: ^1.0.2

  # Loading Indicators
  flutter_spinkit: ^5.2.0

  # Form Validation
  email_validator: ^2.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
